plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.freepets'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-h2console'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'

	// supabase postgresql
	implementation 'org.postgresql:postgresql'

	// swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'

	// aws s3
	implementation 'software.amazon.awssdk:s3:2.29.52'

	// anthropic (claude) — 시설 조건 파싱(FacilityConditionLlmParser)
	// swagger-annotations(비-jakarta, 2.2.31)를 같이 끌고 오는데, springdoc이 쓰는
	// swagger-annotations-jakarta(2.2.47)와 클래스명(io.swagger.v3.oas.annotations.media.Schema)이
	// 겹쳐서 클래스패스에 둘 다 올라가면 어느 쪽이 로드되느냐에 따라 NoSuchMethodError($dynamicRef)가
	// 난다 — springdoc이 신버전 API를 호출했는데 구버전 클래스가 로드된 경우. 우리는 이 SDK가
	// swagger-annotations를 실제로 쓰는 기능(도구 스키마 자동생성 등)은 안 쓰므로 제외한다.
	implementation('com.anthropic:anthropic-java:2.34.0') {
		exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// 관광공사 API 탐사용 일회성 실행. 실제 외부 API를 호출하므로 test 태스크에서는 돌지 않는다.
// 실행: ./gradlew tourApiProbe
//      ./gradlew tourApiProbe --tests "*전체_규모*"
tasks.register('tourApiProbe', Test) {
	group = 'verification'
	description = '한국관광공사 KorService2 탐사 (외부 API 호출)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.infra.tourapi.TourApiProbeTest'
	}

	systemProperty 'tourapi.probe', 'true'

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	// 매번 실제 호출 결과를 받아야 하므로 캐시된 성공 결과를 재사용하지 않는다.
	outputs.upToDateWhen { false }
}

// 관광공사 시설 데이터 적재. 외부 API를 수백 회 호출하고 DB에 수만 건을 쓴다.
// 실행: ./gradlew facilitySync
tasks.register('facilitySync', Test) {
	group = 'application'
	description = '한국관광공사 시설 데이터를 DB에 적재한다 (외부 API 호출 + 대량 쓰기)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilitySyncRunner'
	}

	systemProperty 'facility.sync', 'true'

	// 전량 적재는 수십 분이 걸릴 수 있다.
	timeout = Duration.ofHours(3)

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// 관광공사 법정동 코드를 지역 테이블에 적재한다. 지역 칩이 이 테이블을 읽는다.
// 실행: ./gradlew regionSync
tasks.register('regionSync', Test) {
	group = 'application'
	description = '관광공사 법정동 코드를 지역 테이블에 적재한다'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.RegionSyncRunner'
	}

	systemProperty 'region.sync', 'true'

	// 전국이 250여 건이라 호출이 한두 번이면 끝난다.
	timeout = Duration.ofMinutes(10)

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// 저장된 리뷰를 시설의 발자국 등급 캐시에 1회 반영한다. 캐시 도입 이전에 쌓인 리뷰를 채운다.
// 실행: ./gradlew facilityGradeBackfill
tasks.register('facilityGradeBackfill', Test) {
	group = 'application'
	description = '저장된 리뷰를 시설의 친화도 점수·리뷰 수·발자국 등급에 반영한다'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityGradeBackfillRunner'
	}

	systemProperty 'facility.grade.backfill', 'true'

	// 외부 호출 없이 DB만 훑는다.
	timeout = Duration.ofMinutes(30)

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// 시설 조건 원문 LLM 파싱. 조건 원문이 있는 시설(약 10%)마다 Claude를 호출한다.
// 실행: ./gradlew facilityConditionParse
tasks.register('facilityConditionParse', Test) {
	group = 'application'
	description = '조건 미처리(NOT_PROCESSED) 시설을 LLM으로 파싱한다 (Claude API 호출)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionLlmParseRunner'
	}

	systemProperty 'facility.condition.parse', 'true'

	timeout = Duration.ofHours(3)

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// facilityConditionParse의 50건 샘플 버전 — 전량 실행 전에 먼저 결과를 검증할 때 쓴다.
// 실행: ./gradlew facilityConditionParseSample
tasks.register('facilityConditionParseSample', Test) {
	group = 'application'
	description = '조건 미처리(NOT_PROCESSED) 시설 중 50건만 LLM으로 파싱한다 (Claude API 호출)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionLlmParseRunner'
	}

	systemProperty 'facility.condition.parse', 'true'
	systemProperty 'facility.condition.parse.limit', '50'

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// facilityConditionParseSample과 달리 조건 원문이 있는 시설만 걸러 뽑는다 — facility_id 순서에
// 조건없음(약 90%) 시설이 몰려 있으면 facilityConditionParseSample은 LLM을 한 번도 못 부를 수
// 있어, 실제 파싱 결과를 검증하려면 이쪽을 쓴다.
// 실행: ./gradlew facilityConditionParseSampleWithCondition
tasks.register('facilityConditionParseSampleWithCondition', Test) {
	group = 'application'
	description = '조건 원문이 있는 NOT_PROCESSED 시설 중 50건만 골라 LLM으로 파싱한다 (Claude API 호출)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionLlmParseRunner'
	}

	systemProperty 'facility.condition.parse', 'true'
	systemProperty 'facility.condition.parse.withCondition', 'true'
	systemProperty 'facility.condition.parse.limit', '50'

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// 원문에 특정 키워드가 있는 시설만 골라 파싱한다 — 특정 조건 시나리오(맹견 배제 등)를
// 집중적으로 검증할 때 쓴다. 기본값은 "맹견" 10건, -Pkeyword/-Plimit로 바꿀 수 있다.
// 실행: ./gradlew facilityConditionParseSampleWithKeyword -Pkeyword=맹견 -Plimit=10
tasks.register('facilityConditionParseSampleWithKeyword', Test) {
	group = 'application'
	description = '원문에 특정 키워드가 있는 NOT_PROCESSED 시설만 골라 LLM으로 파싱한다 (Claude API 호출)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionLlmParseRunner'
	}

	systemProperty 'facility.condition.parse', 'true'
	systemProperty 'facility.condition.parse.keyword', (project.findProperty('keyword') ?: '맹견')
	systemProperty 'facility.condition.parse.limit', (project.findProperty('limit') ?: '10')

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// Batch API(#39)로 NOT_PROCESSED 전량을 한 번에 처리한다 — 시설마다 개별 호출하는
// facilityConditionParse와 달리 배치 하나로 묶어 제출하고 끝날 때까지 대기한다(입력·출력
// 토큰 50% 할인). 배치 처리 시간을 고려해 타임아웃을 넉넉히 둔다.
// 실행: ./gradlew facilityConditionParseBatch
tasks.register('facilityConditionParseBatch', Test) {
	group = 'application'
	description = 'NOT_PROCESSED 시설 전량을 Batch API로 파싱한다 (Claude API 호출, 50% 할인)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionLlmBatchApiRunner'
	}

	systemProperty 'facility.condition.parse.batch', 'true'

	timeout = Duration.ofHours(21)

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// facilityConditionParseBatch의 소규모 샘플 버전 — 전량 제출 전에 먼저 결과를 검증할 때 쓴다.
// 실행: ./gradlew facilityConditionParseBatchSample -Plimit=10
tasks.register('facilityConditionParseBatchSample', Test) {
	group = 'application'
	description = 'NOT_PROCESSED 시설 중 일부만 Batch API로 파싱한다 (Claude API 호출)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionLlmBatchApiRunner'
	}

	systemProperty 'facility.condition.parse.batch', 'true'
	systemProperty 'facility.condition.parse.batch.limit', (project.findProperty('limit') ?: '10')

	timeout = Duration.ofHours(3)

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}


// AMBIGUOUS로 판정된 시설의 원문과 unmapped_condition_text를 나란히 출력한다 — 조회 전용,
// LLM 호출·DB 쓰기 없음. facilityConditionParseSampleWithCondition으로 몇 건 처리해본 뒤
// 그 결과가 실제로 타당한지 원문과 대조해볼 때 쓴다.
// 실행: ./gradlew facilityConditionInspectAmbiguous
tasks.register('facilityConditionInspectAmbiguous', Test) {
	group = 'application'
	description = 'AMBIGUOUS 시설의 원문과 미매핑 텍스트를 출력한다 (조회 전용, API 호출 없음)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionInspectAmbiguousRunner'
	}

	systemProperty 'facility.condition.inspectAmbiguous', 'true'
	systemProperty 'facility.condition.inspectAmbiguous.limit', (project.findProperty('limit') ?: '10')

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// 원문에 kg 언급 없이 LLM이 지어낸 maxWeight를 버리는 방어 코드를 넣은 뒤, 반대로 원문에
// 실제 체중 제한이 있는 정상 케이스는 여전히 잘 뽑히는지 실제 데이터로 확인한다 — 조회
// 전용, LLM 호출·DB 쓰기 없음.
// 실행: ./gradlew facilityConditionInspectParsedWeight
tasks.register('facilityConditionInspectParsedWeight', Test) {
	group = 'application'
	description = '체중 상한이 정상적으로 뽑힌 PARSED 시설을 출력한다 (조회 전용, API 호출 없음)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionInspectAmbiguousRunner'
	}

	systemProperty 'facility.condition.inspectAmbiguous', 'true'
	systemProperty 'facility.condition.inspectAmbiguous.parsed', 'true'

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// 이미 저장된 시설 중 원문에 kg 언급 없이 maxWeight만 채워진 과거 오염 데이터를 찾아
// 정리한다(예: facility 3283, 48346). petConditionStatus = NOT_PROCESSED만 훑는
// facilityConditionParse* 배치는 이미 PARSED/AMBIGUOUS로 저장된 이런 시설을 절대 다시
// 안 건드리므로 별도 청소가 필요하다. LLM 호출 없이 이미 있는 값만 검사해서 지우므로
// 비용은 안 들지만 DB 쓰기는 실제로 일어난다.
// 실행: ./gradlew facilityConditionCleanUpMaxWeight
tasks.register('facilityConditionCleanUpMaxWeight', Test) {
	group = 'application'
	description = '원문에 체중 언급 없이 저장된 maxWeight를 정리한다 (LLM 호출 없음, DB 쓰기 있음)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionCleanUpMaxWeightRunner'
	}

	systemProperty 'facility.condition.cleanUpMaxWeight', 'true'

	timeout = Duration.ofHours(3)

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}

// facilityConditionCleanUpMaxWeight의 50건 샘플 버전 — 전량 실행 전에 먼저 결과를 검증할 때 쓴다.
// 실행: ./gradlew facilityConditionCleanUpMaxWeightSample
tasks.register('facilityConditionCleanUpMaxWeightSample', Test) {
	group = 'application'
	description = '원문에 체중 언급 없이 저장된 maxWeight 중 50건만 정리한다 (LLM 호출 없음, DB 쓰기 있음)'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.freepets.domain.facility.service.FacilityConditionCleanUpMaxWeightRunner'
	}

	systemProperty 'facility.condition.cleanUpMaxWeight', 'true'
	systemProperty 'facility.condition.cleanUpMaxWeight.limit', '50'

	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}

	outputs.upToDateWhen { false }
}
